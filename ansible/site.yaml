---
- name: Converge kitdev sandbox host prerequisites
  hosts: localhost
  gather_facts: true
  become: true
  vars:
    kitdev_lifecycle_mode: "{{ lookup('env', 'KITDEV_LIFECYCLE_MODE') | default('production', true) }}"
  roles:
    - role: preflight
      tags: [always, preflight]
    - role: host_packages
      tags: [packages]
    - role: host_identity
      tags: [identity]
    - role: host_kernel
      tags: [kernel]
    - role: docker
      tags: [docker]
    - role: host_manifest
      tags: [manifest]
