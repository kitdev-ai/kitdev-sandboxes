---
kitdev_supported_platforms:
  - os_version: "26.04"
    lifecycle_modes: [production, development, migration]
  - os_version: "25.04"
    lifecycle_modes: [development, migration]

# Shared group owning runtime artifacts the orchestrator reads. Five scripts
# require it to exist (lifecycle, prepare-layout, preflight-orchestrator,
# seed-local-template, build-envd) and nothing created it, so a fresh host
# failed at the first control-plane step with kitdev_group_required.
kitdev_shared_group:
  name: kitdev
  gid: 61003

kitdev_service_identities:
  - name: kitdev-e2b
    uid: 61000
    gid: 61000
    supplementary_groups: []
  - name: kitdev-proxy
    uid: 61001
    gid: 61001
    supplementary_groups: []
  - name: kitdev-worker
    uid: 61002
    gid: 61002
    supplementary_groups: [kvm, kitdev]

kitdev_prerequisite_packages:
  - ca-certificates
  - curl
  - e2fsprogs
  - git
  - iproute2
  # The orchestrator preflight requires iptables and rsync on every start, and
  # seed-local-template requires rsync. Neither was installed here; the manual
  # Docker bootstrap happened to pull iptables in, which hid the gap.
  - iptables
  - jq
  - kmod
  # procps supplies pgrep, which the prepared-host gate requires.
  - procps
  - qemu-utils
  - rsync
  # The control-plane gate requires the ufw binary before it does anything, and
  # nothing installed it. Ubuntu Server images ship it; minimal and cloud
  # images do not.
  - ufw
  - util-linux

# Hosts whose APT sources may legitimately point at a provider mirror. The
# validator ships only Canonical's own hosts; a provider mirror is an explicit
# operator decision, not a default, so add yours here rather than widening the
# validator.
kitdev_apt_additional_mirrors: []

kitdev_capacity_max_sandbox_memory_mib: 8192
kitdev_capacity_concurrent_hugepage_sandboxes: 2
kitdev_capacity_build_snapshot_headroom_mib: 8192
kitdev_hugepages_max_ram_percent: 50
kitdev_hugepages_min_available_mb_after: 16384
kitdev_nbd_devices: 64
kitdev_nbd_max_partitions: 8
kitdev_prerequisite_state_root: /var/lib/kitdev-sandboxes/host-prerequisites
kitdev_prerequisite_prior_state_path: "{{ kitdev_prerequisite_state_root }}/prior-state.json"
kitdev_prerequisite_manifest_path: "{{ kitdev_prerequisite_state_root }}/manifest.json"
kitdev_prerequisite_reboot_marker: /run/kitdev-sandboxes/host-prerequisites-reboot-required
kitdev_managed_host_files:
  - /etc/modules-load.d/90-kitdev-sandboxes.conf
  - /etc/modprobe.d/90-kitdev-sandboxes-nbd.conf
  - /etc/sysctl.d/90-kitdev-sandboxes.conf
