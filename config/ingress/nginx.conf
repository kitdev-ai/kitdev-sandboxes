worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format kitdev escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"host":"$host","method":"$request_method","status":$status,'
        '"bytes":$body_bytes_sent,"request_seconds":$request_time}';
    access_log /dev/stdout kitdev;
    error_log /dev/stderr warn;

    client_header_timeout 15s;
    client_body_timeout 15m;
    keepalive_timeout 75s;
    send_timeout 24h;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=kitdev_api_rate:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=kitdev_sandbox_rate:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=kitdev_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 127.0.0.1:8080;
        access_log off;
        location = /health {
            return 200 "healthy\n";
        }
        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.sandbox.kitdev.ai;

        ssl_certificate /run/kitdev-tls/wildcard.sandbox.kitdev.ai.crt;
        ssl_certificate_key /run/kitdev-tls/wildcard.sandbox.kitdev.ai.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:kitdev_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 1g;
        limit_req zone=kitdev_api_rate burst=200 nodelay;
        limit_conn kitdev_per_ip 100;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15m;
            proxy_read_timeout 30m;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name
            sandbox.sandbox.kitdev.ai
            "~^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])-i[a-z0-9]{20}\.sandbox\.kitdev\.ai$";

        ssl_certificate /run/kitdev-tls/wildcard.sandbox.kitdev.ai.crt;
        ssl_certificate_key /run/kitdev-tls/wildcard.sandbox.kitdev.ai.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:kitdev_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 1g;
        limit_req zone=kitdev_sandbox_rate burst=500 nodelay;
        limit_conn kitdev_per_ip 500;

        location / {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header E2b-Sandbox-Id $http_e2b_sandbox_id;
            proxy_set_header E2b-Sandbox-Port $http_e2b_sandbox_port;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15m;
            proxy_read_timeout 24h;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
