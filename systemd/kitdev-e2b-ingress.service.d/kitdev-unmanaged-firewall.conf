# Development-lab drop-in. install-ingress.sh publishes this file only when
# KITDEV_UNMANAGED_CONTROL_PLANE_FIREWALL=acknowledged is set in development
# lifecycle, and removes it on any run without that acknowledgement. It exists
# because the unit itself is production-first: without it the service's
# firewall pre-start would run in production lifecycle and correctly refuse the
# acknowledgement. Never install this on a production host.
[Service]
Environment=KITDEV_LIFECYCLE=development
Environment=KITDEV_UNMANAGED_CONTROL_PLANE_FIREWALL=acknowledged
