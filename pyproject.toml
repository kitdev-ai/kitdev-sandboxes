[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kitdev-sandboxes"
version = "0.0.0"
description = "Single-host deployment tooling for an E2B-compatible sandbox platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "kitdev-sandboxes contributors" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/kitdev_sandboxes"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["kitdev_sandboxes"]
